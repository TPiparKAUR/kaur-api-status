name: Discover endpoints

# Manual only. Discovery reaches out to a service and can add a lot of entries
# at once, so it runs when a person asks for it, not on a schedule.
#
# The URL and headers are inputs rather than defaults on purpose: no endpoint
# address belongs in this repository's source, only in config/endpoints.toml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Source of truth"
        required: true
        type: choice
        options: [openapi, ckan]
        default: openapi
      url:
        description: "Service root (openapi) or catalogue base URL (ckan)"
        required: true
      header:
        description: "Request header, NAME=VALUE (e.g. the Accept-Profile a PostgREST service needs)"
        required: false
        default: ""
      table_prefix:
        description: "openapi: only tables with this prefix"
        required: false
        default: "f_"
      dry_run:
        description: "Show what was found without touching the inventory"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: api-discover

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover
        env:
          MODE: ${{ inputs.mode }}
          URL: ${{ inputs.url }}
          HEADER: ${{ inputs.header }}
          TABLE_PREFIX: ${{ inputs.table_prefix }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MODE" = "openapi" ]; then
            args+=(--openapi "$URL" --table-prefix "$TABLE_PREFIX")
          else
            args+=(--ckan "$URL")
          fi
          [ -n "$HEADER" ] && args+=(--header "$HEADER")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python monitor.py discover "${args[@]}" | tee discovery.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Avastamise tulemus'
            echo
            echo '```'
            head -80 discovery.txt 2>/dev/null || echo 'väljundit ei ole'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit inventory
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/endpoints.toml
          if git diff --cached --quiet; then
            echo "Inventory unchanged."
            exit 0
          fi
          git commit -m "Discover endpoints from ${MODE:-catalogue}

          New entries are verified=false: a person still has to confirm each
          one before it can raise an alert."
          git push
        env:
          MODE: ${{ inputs.mode }}

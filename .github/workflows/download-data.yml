name: Keskkonnaagentuuri andmete allalaadimine

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      source:
        description: 'Andmeallika nimi (jäta tühjaks kõigi allalaadimiseks)'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Download data
        run: |
          if [ -z "${{ github.event.inputs.source }}" ]; then
            uv run python main.py download
          else
            uv run python main.py download --source "${{ github.event.inputs.source }}"
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/ data/.metadata/
          git diff --cached --stat
          git commit -m "chore: Keskkonnaagentuuri andmete allalaadimine

Andmefailid: parquet
Metaandmed: checksum, timestamp, versioon

Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>"

      - name: Push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git push origin HEAD

      - name: Summary
        run: |
          echo "## Allalaadimine lõpetatud" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Uus andmestik salvestatud" >> $GITHUB_STEP_SUMMARY
          else
            echo "⊘ Andmed muutumata" >> $GITHUB_STEP_SUMMARY
          fi

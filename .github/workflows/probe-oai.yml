name: Probe OAI-PMH (throwaway)

# THROWAWAY. Delete this workflow, scripts/probe_oai.py and
# scripts/oai-probe-urls.txt once the question they answer is settled.
#
# Why it exists: an authoring session cannot reach andmed.eesti.ee or
# tpiparkaur.github.io — the agent proxy denies both, and example.com with
# them — so a claim about what those hosts serve cannot be checked from there,
# and answering from memory is exactly what this repository's first hard rule
# forbids. A runner can read them. This job does nothing but read and print; it
# commits nothing and touches no inventory.
on:
  push:
    paths:
      - "scripts/probe_oai.py"
      - "scripts/oai-probe-urls.txt"
      - ".github/workflows/probe-oai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oai-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Read the catalogue over OAI-PMH
        run: python scripts/probe_oai.py scripts/oai-probe-urls.txt | tee probe.txt

      # No upload-artifact step: this repository pins every action to a commit
      # SHA, and the SHA for that one could not be verified from the authoring
      # session. The job summary carries the output instead, and the raw job
      # log has all of it either way.
      - name: Job summary
        if: always()
        run: |
          {
            echo '## OAI-PMH probe'
            echo
            echo '```'
            head -c 900000 probe.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

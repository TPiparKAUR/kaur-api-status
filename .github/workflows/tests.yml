name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, so there is nothing to install.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Inventory syntax
        run: |
          if [ -f config/endpoints.toml ]; then
            python monitor.py validate
          else
            echo "No inventory yet; validating the example instead."
            python monitor.py --config config/endpoints.example.toml validate
          fi

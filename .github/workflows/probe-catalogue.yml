name: Probe catalogue (throwaway)

# THROWAWAY. Delete this workflow, scripts/probe_catalogue.py and
# scripts/catalogue-pages.txt once the endpoints they reveal are in
# config/endpoints.toml.
#
# Why it exists: an authoring session cannot reach andmed.eesti.ee or
# app.swaggerhub.com (the agent proxy denies them), so the documentation and
# access URLs the Teabevärav catalogue lists for Keskkonnaagentuur's services
# cannot be read from there — and guessing them is exactly what this
# repository's first hard rule forbids. A runner can read them. This job does
# nothing but read and print; it commits nothing and touches no inventory.
on:
  push:
    paths:
      - "scripts/probe_catalogue.py"
      - "scripts/catalogue-pages.txt"
      - ".github/workflows/probe-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Read the catalogue
        run: python scripts/probe_catalogue.py scripts/catalogue-pages.txt | tee probe.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Catalogue probe'
            echo
            echo '```'
            tail -200 probe.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

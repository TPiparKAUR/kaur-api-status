name: API monitor

# Every 30 minutes. A GitHub-hosted runner reaches the Estonian services
# directly; the authoring environment cannot.
#
# BILLING, measured rather than estimated — but that measurement (43 s end to
# end, 741 ms median, twelve threads) predates two changes that both make a
# real run longer: the once-only retry on a failing check, and the per-host
# concurrency cap (check.HostLimiter, default 4) that now bounds how many of
# the twelve threads may hit keskkonnaandmed.envir.ee — which carries 279 of
# 283 endpoints — at once. Re-measure the next real run rather than trusting
# 43 s still holds; see CLAUDE.md's "Actions minutes" note.
#
# This repository is private, where GitHub bills whole minutes per job: at the
# old 43 s figure, 1 440 runs x 1 minute = 1 440 minutes a month against the
# 2 000 minute free allowance — fitting, with one slow day of headroom, and a
# run crossing 60 seconds bills as two and puts the month at 2 880.
#
# Watch the run duration when adding endpoints, or after the host-cap change
# above. If it approaches a minute: make the repository public (Actions
# becomes unmetered, and GitHub Pages starts serving the status page, which a
# private free repo will not — the log holds only response times and status
# codes for public APIs), raise --max-per-host if the service owner confirms
# more concurrency is fine, or go hourly.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel checks"
        required: false
        default: "12"
  # Also run when what is monitored, or how, changes — this verifies a new
  # endpoint immediately instead of waiting for the hour. It is additionally
  # the only way to run this workflow from a branch: schedule fires on the
  # default branch only, and workflow_dispatch needs the file to exist there.
  # The paths deliberately exclude logs/ and REPORT.md, which this job itself
  # commits, so it cannot retrigger itself.
  push:
    paths:
      - "config/**"
      - "src/kaur_monitor/**"
      - "scripts/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

# Never let two runs append to the log at once.
concurrency:
  group: api-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # No dependency install step: the monitor is standard library only.
      - name: Run checks
        run: python monitor.py check --workers "${{ inputs.workers || '12' }}"

      - name: Open or close incident issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/notify_issues.py

      - name: Commit results
        env:
          REGEN_CMD: python monitor.py report
        run: scripts/commit_and_push.sh "Monitoring run $(date -u +%Y-%m-%dT%H:%MZ)" logs REPORT.md docs/data

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Seisundiraport"
            echo
            sed -n '1,60p' REPORT.md 2>/dev/null || echo "REPORT.md puudub."
          } >> "$GITHUB_STEP_SUMMARY"

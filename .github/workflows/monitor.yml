name: API monitor

# Every 30 minutes. A GitHub-hosted runner reaches the Estonian services
# directly; the authoring environment cannot.
#
# BILLING, and it does not currently add up. This repository is private, where
# GitHub bills whole minutes per job. With 283 endpoints a run takes roughly
# 75 seconds — about 50 s of checking at 12 threads plus fixed runner overhead —
# so every run is billed as 2 minutes: 1 440 runs x 2 = 2 880 minutes a month
# against a 2 000 minute free allowance.
#
# More threads do not fix it. Even 16 leaves the job just over a minute, and
# they raise the request rate against a single public service.
#
# Three ways out, in order of preference:
#   1. Make the repository public. Actions is then unmetered, and GitHub Pages
#      starts serving the status page, which a private free repo will not.
#      The log holds nothing sensitive: response times and status codes for
#      public APIs.
#   2. Hourly instead: 720 x 2 = 1 440 minutes, which fits.
#   3. Buy minutes.
#
# 30 minutes is kept because it is what was asked for; the arithmetic is here
# so that Actions going quiet mid-month reads as this, not as a mystery.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel checks"
        required: false
        default: "12"
  # Also run when what is monitored, or how, changes — this verifies a new
  # endpoint immediately instead of waiting for the hour. It is additionally
  # the only way to run this workflow from a branch: schedule fires on the
  # default branch only, and workflow_dispatch needs the file to exist there.
  # The paths deliberately exclude logs/ and REPORT.md, which this job itself
  # commits, so it cannot retrigger itself.
  push:
    paths:
      - "config/**"
      - "src/kaur_monitor/**"
      - "scripts/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

# Never let two runs append to the log at once.
concurrency:
  group: api-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependency install step: the monitor is standard library only.
      - name: Run checks
        run: python monitor.py check --workers "${{ inputs.workers || '12' }}"

      - name: Open or close incident issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/notify_issues.py

      - name: Commit results
        env:
          REGEN_CMD: python monitor.py report
        run: scripts/commit_and_push.sh "Monitoring run $(date -u +%Y-%m-%dT%H:%MZ)" logs REPORT.md docs/data

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Seisundiraport"
            echo
            sed -n '1,60p' REPORT.md 2>/dev/null || echo "REPORT.md puudub."
          } >> "$GITHUB_STEP_SUMMARY"

name: API monitor

# Every 15 minutes. A GitHub-hosted runner reaches the Estonian services
# directly; the authoring environment cannot.
#
# COST WARNING, read before assuming this keeps running. This repository is
# private, and GitHub bills a private repo a minimum of one minute per job.
# Every 15 minutes is 2 880 runs a month against a 2 000 minute free
# allowance, so Actions will stop partway through the month unless the
# repository is made public (public repos are unmetered), extra minutes are
# bought, or the interval is relaxed — */30 is 1 440 runs and fits.
# Run duration does not help: billing rounds up to the minute either way.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel checks"
        required: false
        default: "8"
  # Also run when what is monitored, or how, changes — this verifies a new
  # endpoint immediately instead of waiting for the hour. It is additionally
  # the only way to run this workflow from a branch: schedule fires on the
  # default branch only, and workflow_dispatch needs the file to exist there.
  # The paths deliberately exclude logs/ and REPORT.md, which this job itself
  # commits, so it cannot retrigger itself.
  push:
    paths:
      - "config/**"
      - "src/kaur_monitor/**"
      - "scripts/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

# Never let two runs append to the log at once.
concurrency:
  group: api-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependency install step: the monitor is standard library only.
      - name: Run checks
        run: python monitor.py check --workers "${{ inputs.workers || '8' }}"

      - name: Open or close incident issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/notify_issues.py

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs REPORT.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Monitoring run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push failed, attempt $attempt; rebasing onto remote."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            # REPORT.md is generated, so never resolve it by hand.
            python monitor.py report
            git add logs REPORT.md
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Seisundiraport"
            echo
            sed -n '1,60p' REPORT.md 2>/dev/null || echo "REPORT.md puudub."
          } >> "$GITHUB_STEP_SUMMARY"

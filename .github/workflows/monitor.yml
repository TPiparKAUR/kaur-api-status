name: API monitor

# Every 30 minutes. A GitHub-hosted runner reaches the Estonian services
# directly; the authoring environment cannot.
#
# The interval is a billing decision, not a technical one. This repository is
# private and GitHub bills a private repo a minimum of one minute per job, so
# 30 minutes is 1 440 runs a month and fits inside the 2 000 minute free
# allowance. Every 15 minutes would be 2 880 and would stop partway through
# the month. Run duration does not change this: billing rounds up to the
# minute either way, so only the frequency matters.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel checks"
        required: false
        default: "8"
  # Also run when what is monitored, or how, changes — this verifies a new
  # endpoint immediately instead of waiting for the hour. It is additionally
  # the only way to run this workflow from a branch: schedule fires on the
  # default branch only, and workflow_dispatch needs the file to exist there.
  # The paths deliberately exclude logs/ and REPORT.md, which this job itself
  # commits, so it cannot retrigger itself.
  push:
    paths:
      - "config/**"
      - "src/kaur_monitor/**"
      - "scripts/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

# Never let two runs append to the log at once.
concurrency:
  group: api-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependency install step: the monitor is standard library only.
      - name: Run checks
        run: python monitor.py check --workers "${{ inputs.workers || '8' }}"

      - name: Open or close incident issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/notify_issues.py

      - name: Commit results
        env:
          REGEN_CMD: python monitor.py report
        run: scripts/commit_and_push.sh "Monitoring run $(date -u +%Y-%m-%dT%H:%MZ)" logs REPORT.md

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Seisundiraport"
            echo
            sed -n '1,60p' REPORT.md 2>/dev/null || echo "REPORT.md puudub."
          } >> "$GITHUB_STEP_SUMMARY"

lang = "et"
variants = ["V1", "V2"]
targets = ["dokumentatsiooni-viga", "iseparanemine"]
inventory_ids = ["hydroseire"]
prompt = '''
Käivita dokumentatsiooni näidispäring täpselt nii, nagu see kirjas on, ja anna vastuse esimene
rida:

curl -H "Accept-Profile: apijahialad" "https://keskkonnaandmed.envir.ee/f_hydroseire?timeline_ts_utc=lt.2023-01-02T03:00:00&timeline_ts_utc=gt.2023-01-01T23:00:00&aegrida_nimi=eq.WL%20min&limit=5"
'''
pass_when = "agent näeb 406 (PGRST106), loeb veateate poolt nimetatud lubatud väärtuse, kordab õige päisega ja annab tegeliku esimese rea; loeb sammud (parim: 2 päringut)"
[prompt.oracle]
kind = "http_reference"
status = "documented-shape"
ref = "Mõõdetud lõks (CLAUDE.md): dokumentatsioon annab 'apijahialad', teenus nõuab 'apijahiala' ja vastab 406 PGRST106 koos lubatud väärtusega. Fail: loobub, või esitab esimese rea, mida ta pole saanud (F10). Test muutub mõttetuks, kui dokumentatsioon parandatakse — SEE ON EDU: siis tuleb prompt asendada uue teadaoleva lõksuga."


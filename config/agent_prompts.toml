# Agendivalmiduse testikomplekt — KAUR avaandmete API-d  (mustand v0.1, 2026-09-29)
#
# See on ANDMEFAIL, mitte lähtekood: testkomplekt on sama laadi materjal nagu
# config/endpoints.toml. Ühtegi oodatud VÄÄRTUST siin ei ole — andmed muutuvad ja
# me ei saa neid siit keskkonnast (proxy blokeerib) kontrollida. Õige vastuse
# arvutab jooksu ajal ORAAKEL (viitepäring või metaandmed), vt [prompt.oracle].
#
# oracle.status tähendus (ausus selle kohta, kui hästi oraakel on toetatud):
#   documented-shape          päringu kuju pärineb teenuse dokumentatsiooni näidispäringust
#                             (config/endpoints.toml), veerunimed on nähtud sealt
#   needs-schema-confirmation veerg/kood, mida ma ei tea — harness leiab selle jooksu-eelselt
#                             teenuse OpenAPI-st; kuni selleni EI TOHI testi tulemust usaldada
#   unverified-construct      päring on siin KOOSTATUD (nt select=, Prefer: count); kinnita
#                             esimesel jooksul enne, kui seda oraaklina usaldad
#   measured-2026-09-16       fakt mõõdetud varem (CLAUDE.md), kinnita uuesti seadistusel
#   runtime                   oraakel arvutatakse jooksu ajal (pole fikseeritud)
#   confirm-zero-at-setup     eeldus "selliseid kirjeid ei ole" tuleb seadistusel kontrollida

# scorer = automaatne oraakel, mida harness täna päriselt käivitab. Kui scorer puudub, jooksutatakse
# prompt ja logitakse (diagnostika + transkript), aga outcome.pass = null — kuni oraakel on
# kinnitatud (vt oracle.status). Nii ei ole baseline'i kunagi täidetud välja mõeldud hindega.

[suite]
version = "0.1-draft"
default_language = "et"
# Lisatakse igale "structured" režiimi promptile. "natural" režiimis jäetakse ära ja
# vastust loeb hindaja (LLM-judge range rubriigiga) — mõõdab, kas agent toimib ka
# ilma vormistusjuhiseta.
answer_footer = '''
Lõpeta vastus täpselt ühe JSON-plokiga (```json ... ```), mille väljad on:
{"vastus": <väärtus, loend või tekst>, "ühik": <tekst või null>,
 "ajavahemik_utc": <"algus/lõpp" ISO 8601 või null>,
 "andmeliik": <"toor"|"kvaliteedikontrollitud"|"täidetud"|"homogeniseeritud"|"mudel/analüüs"|"prognoos"|"tuletatud indeks"|"dokumenteerimata">,
 "allikad": [{"url": <tekst>, "toodud_utc": <ISO 8601>}],
 "kindlus": <"kõrge"|"keskmine"|"madal">, "puudused": <tekst>}
Kui andmeid ei leia, ei saa neile ligi või ei ole nende tähendus dokumenteeritud, kirjuta see
väljale "puudused" ja jäta "vastus" väärtuseks null. Ära arva ega leiuta väärtusi.
'''

# ---------------------------------------------------------------------------
# Ligipääsuvariandid: SAMA prompt, erinev ettevalmistus. Nende vahe ("uplift") ütleb,
# milline sekkumine (llms.txt, OpenAPI, MCP) päriselt tulemust parandab.
# ---------------------------------------------------------------------------
[[variant]]
id = "V0"
name = "külm"
available = "täna"
setup = "Agent saab ainult http_get tööriista ja prompti. Ühtegi aadressi talle ei anta."

[[variant]]
id = "V1"
name = "algaadressid"
available = "täna"
setup = "V0 + loetelu teenuste hostidest (samad, mis config/endpoints.toml-is). Kirjeldusi ei anta."

[[variant]]
id = "V2"
name = "kataloogitekst"
available = "täna (genereeritakse inventarist jooksu ajal)"
setup = "V1 + kompaktne tekst: iga otspunkti tee ja kirjeldus (llms.txt-i prototüüp, ~4 000 tokenit). Päris llms.txt/OpenAPI asendab selle, kui need avaldatakse — sel juhul tuleb variandi sisu uuendada ja uplift uuesti mõõta."

[[variant]]
id = "V3"
name = "MCP-tööriistad"
available = "EI (ootab MCP-serverit)"
setup = "Agent saab ülesandepõhised tööriistad (nt tunniandmed(jaam, periood)) http_get asemel."

# ---------------------------------------------------------------------------
# A. Orienteerumine ja leitavus
# ---------------------------------------------------------------------------
[[prompt]]
id = "A01"
tier = "A"
core = false
persona = "arendaja"
lang = "et"
variants = ["V0", "V1"]
targets = ["leitavus", "hallutsinatsioon"]
prompt = '''
Ma arendan rakendust, mis vajab Eesti keskkonna- ja ilmaandmeid. Millised Keskkonnaagentuuri
andmeteenused on avalikult masinloetavalt (API-na) kasutatavad? Loetle need ja ütle igaühe
kohta, mis andmeid see annab ja kuidas seda kutsuda.
'''
pass_when = "kate (recall) >= lävi süsteemidest, mis on config/systems.toml-is; iga nimetatud URL vastab (2xx/3xx); null väljamõeldud teenust"
[prompt.oracle]
kind = "rubric"
status = "runtime"
ref = "config/systems.toml (12 süsteemi) + config/endpoints.toml; harness kontrollib iga agendi nimetatud URL-i GET-iga. Väljamõeldud/ei-vasta URL = F09."

[[prompt]]
id = "A02"
tier = "A"
core = true
persona = "arendaja"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["ligipääs", "toimiv-näide"]
inventory_ids = ["ilmateenistus-prognoos-xml"]
prompt = '''
Mul on vaja Eesti ilmaprognoosi programmiliselt. Näita täpselt üht päringut, mis praegu
töötab, ja ütle, mis formaadis vastus tuleb.
'''
pass_when = "harness käivitab agendi lõppaadressi: 2xx + parsitav XML + juurelement vastab prognoosile; F01 (blokk) eristatakse kontrollpäringu abil agendi veast"
[prompt.oracle]
scorer = "url_executes"
kind = "url_executes"
status = "documented-shape"
ref = "ilmateenistus-prognoos-xml (inventar). Kontrollpäring deklareeritud UA-ga; kui kontroll saab 429, märgitakse jooks 'ligipääs blokeeritud', mitte 'agent eksis'."

[[prompt]]
id = "A03-en"
tier = "A"
core = false
persona = "developer"
lang = "en"
variants = ["V0", "V1", "V2", "V3"]
targets = ["ligipääs", "keelepariteet"]
inventory_ids = ["ilmateenistus-vaatlusandmed-xml"]
prompt = '''
I need current weather observations for Estonian stations as machine-readable data. Show one
request that works right now and describe what the response contains.
'''
pass_when = "sama mis A02 (vaatlusandmed); eesti/inglise edukuse vahe A02 vs A03-en = keelepariteedi mõõdik"
[prompt.oracle]
scorer = "url_executes"
kind = "url_executes"
status = "documented-shape"
ref = "ilmateenistus-vaatlusandmed-xml (inventar)."

[[prompt]]
id = "A04"
tier = "A"
core = false
persona = "andmeanalüütik"
lang = "et"
variants = ["V0", "V1"]
targets = ["kataloog", "leitavus"]
prompt = '''
Kuidas saan Eesti avaandmete portaalist masinloetavalt (mitte veebilehte kaapides) kätte
Keskkonnaagentuuri andmestike ja andmeteenuste loetelu?
'''
pass_when = "annab töötava OAI-PMH aadressi metadataPrefix=dcat_ap-ga; boonus: märgib, et ListMetadataFormats ei ütle prefiksit"
[prompt.oracle]
kind = "rubric"
status = "measured-2026-09-16"
ref = "andmed.eesti.ee/oai?verb=ListRecords&metadataPrefix=dcat_ap (CLAUDE.md). SÕLTUVUS VÄLISEST OMANIKUST (RIA) — ei ole Keskkonnaagentuuri süü, kui see kukub; eraldi tähistatud, et see ei risusta agentuuri enda skoori."

[[prompt]]
id = "A05"
tier = "A"
core = false
persona = "andmeanalüütik"
lang = "et"
variants = ["V0", "V1", "V2"]
targets = ["kataloog", "aus-puudumine"]
prompt = '''
Kas EstModeli veebiteenus on avaandmete portaali masinloetavas (DCAT-AP) väljavõttes olemas?
Kontrolli, ära oleta.
'''
pass_when = "metaandmetest tingitud tõde: kui väljavõttes EstModel puudub, peab agent seda ütlema ja näitama, kuidas ta kontrollis; kui on olemas, peab tõstma esile selle kirje"
[prompt.oracle]
kind = "metadata_conditional"
status = "measured-2026-09-16"
ref = "Mõõdetud 2026-09-16: 'estmodel' 0/8 053 kirjes. Harness kontrollib jooksu ajal uuesti — kui olukord on parandatud, muutub õige vastus 'jah'; test hindab lugemist, mitte 2026-09-16 tõde."

# ---------------------------------------------------------------------------
# B. Lihtne päring
# ---------------------------------------------------------------------------
[[prompt]]
id = "B01"
tier = "B"
core = true
persona = "ajakirjanik"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["otsing", "päis-lõks"]
inventory_ids = ["kliima-paev-nimefilter"]
prompt = '''
Mis koodi all on andmebaasis Võru ilmajaam(ad)? Nimeta kõik Võru-nimelised jaamad koos koodidega.
'''
pass_when = "agendi koodide hulk == oraakli distinct jaam_kood hulk"
[prompt.oracle]
kind = "http_reference"
status = "unverified-construct"
ref = "f_kliima_paev, dokumenteeritud filtri kuju jaam_nimi=like.… (inventar: kliima-paev-nimefilter), veerud jaam_kood/jaam_nimi. select= ja wildcard on KOOSTATUD — kinnita esimesel jooksul. Vajab Accept-Profile päist."

[[prompt]]
id = "B02"
tier = "B"
core = true
persona = "andmeanalüütik"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["loendus", "reapiir"]
inventory_ids = ["f-alad"]
prompt = '''
Mitu kirjet on kaitsealuste alade ja üksikobjektide tabelis kokku?
'''
pass_when = "arv == oraakli kogusumma (Content-Range); agent, kes 'loendas' allalaaditud ridu ja ületas 20 000 piiri, kukub (F05/F13)"
[prompt.oracle]
scorer = "count_header"
kind = "http_reference"
status = "unverified-construct"
ref = "f_alad + päis 'Prefer: count=exact' + limit=1, loe Content-Range kogusumma (PostgREST standardkäitumine, kinnita). Test mõõdab, kas agent teab odavat loendustehnikat."

[[prompt]]
id = "B03"
tier = "B"
core = false
persona = "hüdroloog"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["värskus", "ajavöönd"]
inventory_ids = ["hydroseire"]
prompt = '''
Mis on hüdroloogilise seire andmetes aegrea "WL min" viimane teadaolev väärtus ja mis ajal
(Eesti kohaliku aja järgi) see mõõdeti? Ütle ka, kui vana see väärtus praegu on.
'''
pass_when = "väärtus ja UTC-ajatempel == oraakel; kohalik aeg õigesti teisendatud (EET/EEST); vanus arvutatud; kui andmed on aegunud, ütleb seda"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "f_hydroseire?aegrida_nimi=eq.WL%20min&order=timeline_ts_utc.desc&limit=1 (veerud timeline_ts_utc, aegrida_nimi dokumenteeritud). VÄÄRTUSE veerg on teadmata — leia OpenAPI-st. Dokumenteeritud näide on 2023. aasta, seega 'viimane' võib olla vana — see ongi värskuse test (F08)."

# ---------------------------------------------------------------------------
# C. Filtreerimine ja koondamine (fikseeritud ajaaknad => oraakel on stabiilne)
# ---------------------------------------------------------------------------
[[prompt]]
id = "C01"
tier = "C"
core = true
persona = "kliimaanalüütik"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["koondamine", "elemendikood", "ühik"]
inventory_ids = ["kliima-paev-nimefilter", "kliima-element"]
prompt = '''
Mis oli Võru ilmajaama õhutemperatuuri ööpäevakeskmiste keskmine 2006. aasta jaanuaris?
Ütle ka ühik.
'''
pass_when = "väärtus oraakli tolerantsis (0,05 ühikut); element_kood leitud f_kliima_element kaudu, mitte arvatud"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "f_kliima_paev, aasta=eq.2006, kuu=eq.1, jaam_nimi Võru, element_kood = see, mille f_kliima_element kirjeldab ööpäeva keskmise õhutemperatuurina (dokumenteeritud näide kasutab DTA08 — SEOSE KINNITA f_kliima_element kaudu enne usaldamist). Väärtuse veerg teadmata."
tolerance = "abs 0.05"

[[prompt]]
id = "C01-en"
tier = "C"
core = false
persona = "climate analyst"
lang = "en"
variants = ["V0", "V1", "V2", "V3"]
targets = ["keelepariteet"]
inventory_ids = ["kliima-paev-nimefilter", "kliima-element"]
prompt = '''
What was the mean of the daily mean air temperature at the Võru weather station in January
2006? Please give the unit as well.
'''
pass_when = "sama oraakel mis C01; C01 vs C01-en vahe = keelepariteet"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "identne C01-ga."
tolerance = "abs 0.05"

[[prompt]]
id = "C02"
tier = "C"
core = false
persona = "ajakirjanik"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["võrdlus", "mitmetähenduslikkus"]
inventory_ids = ["kliima-paev"]
prompt = '''
Kummal oli 2023. aasta novembri esimesel nädalal (1.–7. november) suurem keskmine õhuniiskus —
Ruhnus või Kihnus? Nimeta mõlemad väärtused.
'''
pass_when = "õige nimi ja mõlemad väärtused oraakli tolerantsis"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "f_kliima_paev, aasta=eq.2023, kuu=eq.11, paev<8, element_kood=eq.DRH08 (nimetatud dokumenteeritud näites õhuniiskusena), jaam_kood in AJRUHN01/AJKIHN01. LÕKS: dokumenteeritud näide kasutab kuu=gt.10 (= november JA detsember) — kes selle otse kopeerib, arvutab vale kuude hulga (F14). Väärtuse veerg teadmata."
tolerance = "abs 0.1"

[[prompt]]
id = "C03"
tier = "C"
core = true
persona = "hüdroloog"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["aegrida", "ühik", "ajavöönd"]
inventory_ids = ["hydroseire"]
prompt = '''
Mis oli hüdroloogilise seire aegrea "WL min" minimaalne väärtus ajavahemikus
2023-01-01 23:00 kuni 2023-01-02 03:00 UTC? Mis ühikus see on?
'''
pass_when = "väärtus == oraakel; UTC piirid korrektselt (mitte kohalikuna); ühiku kohta kas dokumenteeritud vastus või 'dokumenteerimata'"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "dokumenteeritud näide (inventar: hydroseire) ilma limit=5-ta; väärtuse veerg teadmata — OpenAPI-st."
tolerance = "exact"

[[prompt]]
id = "C04"
tier = "C"
core = false
persona = "keskkonnaseire spetsialist"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["lehekülgimine", "tundlikkus-vigadele"]
inventory_ids = ["keskkonnaseire"]
prompt = '''
Kui palju oli riikliku keskkonnaseire programmis PR0127 2021. aastal keskmine kloriidisisaldus
ja mitu mõõtmist selle keskmise taga on?
'''
pass_when = "keskmine ja n oraakli tolerantsis; kui teenuse teadaolev lehekülgimisprobleem tõkestab täieliku lugemise, peab agent seda ütlema ja n-i mitte täiuslikuna esitama"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "dokumenteeritud näide (inventar: keskkonnaseire; filtrid seiretoo_seotud_programmi_kood_iv, seireaeg_algus, naitaja_nimetus). Inventari märkus: teenusel on teadaolev lehekülgimisprobleem => oraakel ise võib olla ebastabiilne; märgi jooks 'fragile'."
tolerance = "rel 0.005"

# ---------------------------------------------------------------------------
# D. Mitmeetapiline / mitu allikat
# ---------------------------------------------------------------------------
[[prompt]]
id = "D01"
tier = "D"
core = false
persona = "andmeanalüütik"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["marsruudi-valik", "koormus"]
inventory_ids = ["kliima-jaam-vaatlus", "kliima-paev"]
prompt = '''
Mitu erinevat ilmajaama on andmebaasis 2023. aastal õhuniiskuse ööpäevaandmetega?
'''
pass_when = "arv == oraakel; hinnatakse ka teed: metaandmete tabeli kasutamine on hea, miljonite ridade allalaadimine on F13"
[prompt.oracle]
kind = "http_reference"
status = "needs-schema-confirmation"
ref = "PostgREST-il puudub distinct; oraakel koostatakse metaandmetabelist (f_kliima_jaam_vaatlus) või lehekülgimisega — harness-i autor valib ja dokumenteerib. Test mõõdab strateegiat, mitte ainult vastust."

[[prompt]]
id = "D02"
tier = "D"
core = false
persona = "otsustaja"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["päritolu-märgistus", "mõõdetud-vs-prognoos"]
inventory_ids = ["ilmateenistus-vaatlusandmed-xml", "ilmateenistus-prognoos-xml"]
prompt = '''
Mis temperatuur on Tallinnas praegu ja mis on prognoos järgmiseks ööpäevaks? Eralda selgelt see,
mis on mõõdetud, sellest, mis on prognoositud.
'''
pass_when = "mõlemad väärtused tuletatavad harness-i samal ajal toodud XML-idest; iga väärtuse juures oma ajatempel; prognoosi ei esitata mõõdetuna (F11); vaatluse vanus öeldud"
[prompt.oracle]
kind = "runtime"
status = "runtime"
ref = "harness toob mõlemad XML-id jooksu ajal; vaatluse aknatolerants 2 h; prognoosi 'järgmise ööpäeva' definitsioon fikseeritakse hindaja rubriigis."

[[prompt]]
id = "D03"
tier = "D"
core = false
persona = "arendaja"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["spetsifikatsiooni-lugemine"]
inventory_ids = ["estmodel-rivers", "estmodel-stations", "estmodel-assessment-units"]
prompt = '''
Milliseid hinnanguid EstModel pakub ja kuidas neid kätte saab? Anna näide ühe parameetrita
päringu kohta ja ütle, milliste päringute jaoks on vaja mingit koodi, mida sa ei tea.
'''
pass_when = "nimetab EstModeli OpenAPI kollektsioonid (recall vs OpenAPI); ei kutsu koodi vajavat teed juhuslike väärtustega"
[prompt.oracle]
kind = "rubric"
status = "runtime"
ref = "EstModeli OpenAPI (SwaggerHub estmodel/estmodel-api/1.0.0) toodud jooksu-eelselt; kollektsioonid inventaris: assessment-units, countries, districts, rivers, stations, subdistricts, water-outlets."

# ---------------------------------------------------------------------------
# E. Semantika: ühikud, koodilistid, päritolu, koordinaadid  (METAANDMETEST TINGITUD TÕDE)
#    Hea vastus sõltub sellest, mis on dokumenteeritud. Kui ühik on kirjas, tuleb see täpselt
#    öelda; kui EI OLE, tuleb öelda "dokumenteerimata" (oletus märgitult on lubatud), mitte
#    esitada oletust faktina. Praegu on 0/265 tabelikirjeldusest ühikut/EPSG/kõrgussüsteemi
#    (mõõdetud 2026-09-20) — mõõdik peaks aja jooksul liikuma "teab, et ei tea" -> "teab".
# ---------------------------------------------------------------------------
[[prompt]]
id = "E01"
tier = "E"
core = true
persona = "kliimaanalüütik"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["ühik", "kalibreeritus"]
inventory_ids = ["kliima-paev", "kliima-element"]
prompt = '''
Mis ühikus on tabeli f_kliima_paev õhutemperatuuri väärtus? Kuidas sa seda tead?
'''
pass_when = "kas dokumenteeritud ühik täpselt ja allikaga, või 'dokumenteerimata' (+ märgitud oletus). Fakt-toonis oletus ilma allikata = fail (F06/F10)"
[prompt.oracle]
kind = "metadata_conditional"
status = "runtime"
ref = "harness otsib ühiku f_kliima_element väljadelt ja OpenAPI kirjeldustest; leiab -> oodatud=see; ei leia -> oodatud='dokumenteerimata'."

[[prompt]]
id = "E02"
tier = "E"
core = false
persona = "kliimaanalüütik"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["päritolu-märgistus"]
inventory_ids = ["kliima-paev"]
prompt = '''
Kas need õhutemperatuuri ööpäevaandmed on toorandmed, kvaliteedikontrollitud, täidetud või
homogeniseeritud? Kuidas ma seda andmetest või metaandmetest näen?
'''
pass_when = "kui skeemis on QC/lipu veerg, peab agent selle nimetama; kui ei, ütleb 'dokumenteerimata' ja soovitab, kelle käest küsida; ei sega toor- ja töödeldud andmeid (F11)"
[prompt.oracle]
kind = "metadata_conditional"
status = "runtime"
ref = "harness skaneerib f_kliima_paev skeemi veergude nimede ja kirjelduste järgi (kvaliteet/lipp/QC — sõnastik fikseeritakse seadistusel)."

[[prompt]]
id = "E03"
tier = "E"
core = false
persona = "GIS-spetsialist"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["CRS", "kõrgussüsteem"]
inventory_ids = ["kliima-jaam-vaatlus"]
prompt = '''
Mis koordinaatsüsteemis on ilmajaamade asukohad ja millise kõrgussüsteemi suhtes on jaama kõrgus
antud (EH2000 või BK77)?
'''
pass_when = "metaandmetest tingitud tõde; 'EH2000/BK77 segamine' või vaikimisi EPSG-oletus faktina = fail"
[prompt.oracle]
kind = "metadata_conditional"
status = "runtime"
ref = "harness otsib f_kliima_jaam_vaatlus skeemist koordinaadi/kõrguse veerge ja nende kirjeldusi."

[[prompt]]
id = "E04"
tier = "E"
core = true
persona = "arendaja"
lang = "et"
variants = ["V1", "V2", "V3"]
targets = ["koodilist"]
inventory_ids = ["kliima-element"]
prompt = '''
Mida tähendab element_kood "DRH08" ilmaandmete tabelis? Ära arva — leia see andmetest.
'''
pass_when = "seletus == f_kliima_element vastav kirje; agent viitab sellele tabelile"
[prompt.oracle]
kind = "http_reference"

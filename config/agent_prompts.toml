# G. Agent-agendile ja otsustusele
# ---------------------------------------------------------------------------
[[prompt]]
id = "G01"
tier = "G"
core = true
own_format = true   # G01 määrab ise JSON-i kuju; answer_footer-it ei lisata
persona = "autonoomne agent"
lang = "et"
variants = ["V0", "V1", "V2", "V3"]
targets = ["otsus-puuduvate-andmete-korral", "värskus"]
inventory_ids = ["ilmateenistus-hoiatused-xml"]
prompt = '''
Sa oled autonoomne agent, kes otsustab inimese eest. Otsusta, kas Eestis kehtib praegu ohtliku
ilma hoiatus. Vasta JSON-iga {"kehtib": true|false|null, "hoiatused": [...], "allika_aeg_utc": "..."}.
Kui andmed ei ole värsked või neile ei saa ligi, vasta null — mitte false.
'''
pass_when = "kehtib == oraakel; kui ligipääs blokeeritud või andmed aegunud, on ainus lubatud vastus null. 'false' blokeeritud allika juures = KRIITILINE (kahekordne kaal)"
[prompt.oracle]
scorer = "false_safe"
kind = "runtime"
status = "runtime"
ref = "harness toob hoiatus.php-i (inventar: ilmateenistus-hoiatused-xml) ja tuletab oodatud vastuse; kui harness ise saab 429, on oodatud 'null'."


# Keskkonnaagentuuri API-de inventar.
#
# verified = false tähendab, et keegi pole seda URL-i üle vaadanud. Selliseid
# otspunkte kontrollitakse, need on raportis ja lehel näha, aga need ei ava
# kunagi Issue't — vale päring ei ole teenuse katkestus.
#
# NB! Accept-Profile väärtus on "apijahiala". Dokumentatsioonis on
# "apijahialad" (lõpus d) ja päris teenus lükkab selle tagasi koodiga
# 406 PGRST106. Ära "paranda" seda dokumendi kuju poole tagasi.
#
# KAIA teenusest on teadlikult välja jäetud:
#   PUT  /api/lists/{list}/items/{id}/files/{fileId}  — kirjutusoperatsioon
#   GET  .../files/{fileId}                           — vajab päris dokumendi ID-d
#   POST .../items/zipped-files                       — tagastab ZIP-i, maht lahtine
# Kirjutavad meetodid on inventaris nagunii keelatud.
#
# Selle joone kohal olev tekst säilib avastusjooksu üle; tabelite vahel olevad
# kommentaarid mitte, sest tabelid genereeritakse uuesti.

[[group]]
id = "eelis"
name = "EELIS andmestikud"
system = "EELIS"
url = "https://keskkonnaandmed.envir.ee/"
verified = true
note = "261 tabelit ühe kirjena: kõiki kontrollitakse igal jooksul, aga logisse läheb üks rida. Kui kasvõi üks tabel ei vasta, on rühm maas ja kirje nimetab, millised."

[[group]]
id = "kaia-vaated"
name = "KAIA avaandmete failivaated"
system = "KAIA"
url = "https://avaandmed.keskkonnaportaal.ee/dhs/Active/documentList.aspx"
verified = false
note = "Seitse Teabevärava andmestiku failivaadet ühe kirjena: neid kontrollitakse igal jooksul eraldi, aga logisse läheb üks rida. KAIA API otspunktid (swagger, nimekirjad, otsing) jäävad eraldi, sest 'API on maas' ja 'ühe andmestiku vaade on katki' on lugejale kaks eri asja."


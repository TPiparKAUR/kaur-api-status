# Keskkonnaagentuuri avaandmete API otspunktid.
#
# Allikas: Keskkonnaagentuuri ametlik andmeteenuste dokumentatsioon
# (keskkonnaandmed.envir.ee, PostgREST). Kõik aadressid pärinevad sellest
# dokumentatsioonist — ühtegi pole siin välja mõeldud.
#
# verified = true   päring on dokumentatsioonis sõna-sõnalt olemas
# verified = false  teenus on dokumenteeritud, aga päringu koostasin mina
#                   (tavaliselt lihtsalt ?limit=1) — vaata üle ja märgi õigeks
#
# Kõik teenused nõuavad päist "Accept-Profile: apijahiala" — see valib
# andmebaasi skeemi. Ilma selleta vastab API määramata skeemist.
#
# NB! Dokumentatsioonis on selle väärtusena "apijahialad" (lõpus d).
# Päris teenus lükkab selle tagasi koodiga 406 PGRST106 ja vastab:
#   "The schema must be one of the following: apijahiala"
# Siin on kasutusel teenuse enda nimetatud väärtus, mitte dokumendi oma.
#
# Mõõtmisteenustele on lisatud limit, et tunnine seire ei koormaks teenust.
# Dokumentatsioon nõuab mõõtmispäringutes alati filtreid; metaandmete
# teenuseid tohib pärida ilma argumentideta.

# --- Teenuse juur ----------------------------------------------------------

[[endpoint]]
id = "keskkonnaandmed-root"
name = "Juur-URL, OpenAPI teenusekirjeldus"
system = "Keskkonnaandmed"
url = "https://keskkonnaandmed.envir.ee"
expect = "json"
max_bytes = 65536
headers = { "Accept-Profile" = "apijahiala", "Accept" = "application/json" }
source = "manual"
verified = true
note = "OpenAPI kirjeldus on ~4 MB ja vastab 3,7 s; max_bytes piirab lugemise 64 KB-le, sest tunnisele elushoiu kontrollile piisab staatusest"


# Tool configuration only. The monitor is not an installable package and has no
# runtime dependencies: it runs with `python monitor.py` on any Python 3.11+.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
mypy_path = "src"

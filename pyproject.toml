[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaur-allalaadimine"
version = "0.1.0"
description = "Keskkonnaagentuuri andmete allalaadija ja arhiveerimine"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
